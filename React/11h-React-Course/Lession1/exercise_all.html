<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>
<body>
    <div class="js-container"></div>
    <div class="clockContainer"></div>
    <!-- An exemple of external library import -->
    <script src="https://unpkg.com/supersimpledev/external-library.js"></script>


    <!-- The react version that will be used through the course -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Translade JSX to JS -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <!-- To use babel we need to specify the type in the scrip element -->

    <!-- for ex1e -->
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
        //exercise 1a
        const ex1a = <button>Good Job!</button>;
        //exercise 1b
        const ex1b = <p>My name is Fernando</p>;
        //exercise 1c
        const ex1c = (
            <div>
                <p>Cotton Socks</p>
                <p>Price: $10</p>
                <button>Add to Cart</button>
            </div>
        )

        //exercise 1d
        const socks = 10;
        const tShirts = 8;
        const productCost = socks + 2*tShirts;
        console.log(productCost);

        //exersice 1e
        const ex1e = <p>Product cost: ${productCost}</p>;

        //exercise 1f
        const shippingCost = 5;
        const ex1f = (
            <div>
                {ex1e}
                <p>Shipping Cost: ${shippingCost}</p>
                <p>Total Cost: ${productCost + shippingCost}</p>    
            </div>
        )

        //exercise 1e
        const date = dayjs().format('MMMM D');
        console.log(date);

        //exercise 1h
        const ex1h = <p>Today is {date}</p>;

        //exercise 1i
        const ex1i = <p>Time at page load: {dayjs().format('HH:mm:ss')}</p>;

        const div = (
            <div>
                {ex1a}
                <p>-----------------</p>
                {ex1b}
                <p>-----------------</p>
                {ex1c}
                <p>-----------------</p>
                {ex1e}
                <p>-----------------</p>
                {ex1f}
                <p>-----------------</p>
                {ex1h}
                <p>-----------------</p>
                {ex1i}
                <p>-----------------</p>
            </div>
        );
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(div);

        //exercise 1j
        function renderClock() {
            const clock = <p>Current time: {dayjs().format('HH:mm:ss')}</p>;
            const clockContainer = document.querySelector('.clockContainer');
            ReactDOM.createRoot(clockContainer).render(clock)
        }

        setInterval(renderClock, 1000);
        renderClock();
    </script>
    
</body>
</html>
