<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
</head>
<body>
     <div class="js-container"></div>

    <!-- The react version that will be used through the course -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <!-- Translade JSX to JS -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <!-- To use babel we need to specify the type in the scrip element -->
    <script type="text/babel">
        function ChatInput({chatMessages, setChatMessages}) {
            const [inputText, setInputText] = React.useState("");

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function sendMessage() {
                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    }
                ];
                setChatMessages(newChatMessages);
                
                const response = Chatbot.getResponse(inputText); 
                
                setChatMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                setInputText("");
            }
            return (
                <>
                    <input 
                        type="text" 
                        placeholder="Send a message to Chatbot" 
                        size="30"
                        onChange={saveInputText}
                        value={inputText}
                    />
                    <button
                        onClick={sendMessage}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({message, sender}) {
            return (
                <div>
                    {sender == 'robot' && <img src="https://supersimple.dev/projects/chatbot/robot.png" alt="" width="50"/>}
                    <span>{message}</span>
                    {sender == 'user' && <img src="https://supersimple.dev/projects/chatbot/user.png" alt="" width="50"/>}    
                </div>
            )
        }

        function ChatMessages({chatMessages}) {
            const chatMessageComponents = chatMessages.map(({message, sender, id}) => {
                return (
                    <ChatMessage
                        message = {message}
                        sender = {sender}
                        key = {id}
                    />
                );
            });  
            
            return (
                <>
                    {chatMessageComponents}
                </>
            );
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([{
                message: "Hello Chat",
                sender: "user",
                id: "id1"
            }, {
                message: "Hello! How can I help you",
                sender: "robot",
                id: "id2"
            }]);
            // const chatMessages = array[0]; //current data
            // const setChatMessages = array[1]; //function to update data and change state

            return  (
                <>
                    <ChatInput
                        chatMessages = {chatMessages}
                        setChatMessages = {setChatMessages}
                    />
                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                </>
            ); 
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
</body>
</html>
