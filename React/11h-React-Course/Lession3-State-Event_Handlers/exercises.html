<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>
<body>
    <div class="js-container"></div>
    <!-- An exemple of external library import -->
    <script src="https://unpkg.com/supersimpledev/external-library.js"></script>


    <!-- The react version that will be used through the course -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Translade JSX to JS -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <!-- To use babel we need to specify the type in the scrip element -->
    <script type="text/babel">
        

        function Counter() {
            const [counter, setCounter] = React.useState(0);
            function increaseCounter() {
                let aux = counter + 1;
                console.log(aux);
                setCounter(aux);
                if(aux == 1) {
                    setCounterTimesText("time");
                } else if(aux == 2) {
                    setCounterTimesText("times");
                }

            }
            const [counterTimesText, setCounterTimesText] = React.useState("times");

            return (
                <button
                    onClick = {increaseCounter}
                >Clicked {counter} {counterTimesText}</button>
            );
        }

        function App() {
            return(
                <>
                    <p>The app</p>
                    <Counter/>
                    <Counter/>
                </>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
    
</body>
</html>
