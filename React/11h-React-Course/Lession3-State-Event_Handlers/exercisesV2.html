<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>
<body>
    <div class="js-container"></div>
    <!-- An exemple of external library import -->
    <script src="https://unpkg.com/supersimpledev/external-library.js"></script>


    <!-- The react version that will be used through the course -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Translade JSX to JS -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <!-- To use babel we need to specify the type in the scrip element -->
    <script type="text/babel">
        

        function Counter({value, increaseCounter}) {
            let timesText = value == 1 ? "time" : "times";

            return (
                <button
                    onClick = {increaseCounter}
                >Clicked {value} {timesText}</button>
            );
        }

        function CounterHandler() {
            const [counter1, setCounter1] = React.useState(0);
            const [counter2, setCounter2] = React.useState(0);

            function increaseCounter(counter, setCounter) {
                setCounter(counter + 1);
            }

            return (
                <>
                    <Counter
                        value = {counter1}
                        increaseCounter = {() => increaseCounter(counter1, setCounter1)}
                    />
                    <Counter
                        value = {counter2}
                        increaseCounter = {() => increaseCounter(counter2, setCounter2)}
                    />
                    <button
                        onClick={() => {
                            setCounter1(0);
                            setCounter2(0);
                        }}
                    >Reset All</button>
                </>
            )
        }

        function App() {
            return(
                <>
                    <p>The app</p>
                    <CounterHandler/>
                </>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
    
</body>
</html>
